apiVersion: v1
kind: Secret
metadata:
  name: notifications-postgres-secret
  namespace: tenant-grupo3-egs-deti-ua-pt
type: Opaque
stringData:
  POSTGRES_PASSWORD: "postgrespassword"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: notifications-postgres-pvc
  namespace: tenant-grupo3-egs-deti-ua-pt
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: "longhorn"
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-postgres
  namespace: tenant-grupo3-egs-deti-ua-pt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-postgres
  template:
    metadata:
      labels:
        app: notifications-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15
          imagePullPolicy: IfNotPresent
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_DB
              value: "notifications"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notifications-postgres-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U postgres -d notifications -h 127.0.0.1 -p 5432
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: notifications-postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: notifications-postgres
  namespace: tenant-grupo3-egs-deti-ua-pt
spec:
  selector:
    app: notifications-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-redis
  namespace: tenant-grupo3-egs-deti-ua-pt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-redis
  template:
    metadata:
      labels:
        app: notifications-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          resources:
            limits:
              cpu: "100m"
              memory: "128Mi"
            requests:
              cpu: "50m"
              memory: "64Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: notifications-redis
  namespace: tenant-grupo3-egs-deti-ua-pt
spec:
  selector:
    app: notifications-redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379

---
apiVersion: v1
kind: Secret
metadata:
  name: notifications-service-secret
  namespace: tenant-grupo3-egs-deti-ua-pt
type: Opaque
stringData:
  DATABASE_URL: "postgres://postgres:postgrespassword@notifications-postgres:5432/notifications?sslmode=disable"
  MASTER_ADMIN_SECRET: "master_key_notifications_2026"
  JWT_SECRET: "jwt_key_notifications_2026"
  SENDGRID_API_KEY: "PLACEHOLDER_SENDGRID_API_KEY"

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notifications-service-config
  namespace: tenant-grupo3-egs-deti-ua-pt
data:
  PORT: "8080"
  REDIS_URL: "notifications-redis:6379"
  GIN_MODE: "release"
  JWT_EXPIRATION_MINUTES: "15"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications-service
  namespace: tenant-grupo3-egs-deti-ua-pt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications-service
  template:
    metadata:
      labels:
        app: notifications-service
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:15
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h notifications-postgres -p 5432 -U postgres; do
                echo "Waiting for notifications-postgres..."
                sleep 2
              done
      containers:
        - name: notifications-service
          image: registry.deti/project_egs_notifications_service:latest
          imagePullPolicy: Always
          command: ["/app/egs-notifications"]
          envFrom:
            - configMapRef:
                name: notifications-service-config
            - secretRef:
                name: notifications-service-secret
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: notifications-service
  namespace: tenant-grupo3-egs-deti-ua-pt
spec:
  selector:
    app: notifications-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: notifications-service-ingress
  namespace: tenant-grupo3-egs-deti-ua-pt
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web,websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: "traefik"
  tls:
    - hosts:
        - grupo3-egs-deti-ua.pt
      secretName: transactions-tls
  rules:
    - host: grupo3-egs-deti-ua.pt
      http:
        paths:
          - path: /notifications
            pathType: Prefix
            backend:
              service:
                name: notifications-service
                port:
                  number: 8080

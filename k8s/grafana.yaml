---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: tenant-grupo3-egs-deti-ua-pt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: GF_SECURITY_ADMIN_PASSWORD
            - name: TRANSACTION_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: TRANSACTION_DB_PASSWORD
            - name: NOTIFICATIONS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: NOTIFICATIONS_DB_PASSWORD
            - name: PAYMENT_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: grafana-secrets
                  key: PAYMENT_DB_PASSWORD
          volumeMounts:
            - name: datasources-volume
              mountPath: /etc/grafana/provisioning/datasources/postgres.yaml
              subPath: postgres.yaml
            - name: provider-volume
              mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml
              subPath: dashboards.yaml
            - name: dashboards-volume
              mountPath: /etc/grafana/provisioning/dashboards/json
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
      volumes:
        - name: datasources-volume
          configMap:
            name: grafana-datasources-config
        - name: provider-volume
          configMap:
            name: grafana-dashboards-provider-config
        - name: dashboards-volume
          configMap:
            name: grafana-dashboards-config

---
apiVersion: v1
kind: Service
metadata:
  name: grafana-svc
  namespace: tenant-grupo3-egs-deti-ua-pt
spec:
  type: ClusterIP
  selector:
    app: grafana
  ports:
    - name: http
      port: 3000
      targetPort: 3000

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-ingress
  namespace: tenant-grupo3-egs-deti-ua-pt
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
spec:
  ingressClassName: "traefik"
  rules:
    - host: grafana.grupo3-egs-deti-ua.pt
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana-svc
                port:
                  number: 3000

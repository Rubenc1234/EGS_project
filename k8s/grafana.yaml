apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: tenant-grupo3-egs-deti-ua-pt
data:
  postgres.yaml: |
    apiVersion: 1
    datasources:
    - database: transaction_db
      jsonData:
        postgresVersion: 15
        sslmode: disable
      name: Transactions-DB
      secureJsonData:
        password: ${TRANSACTION_DB_PASSWORD}
      type: postgres
      url: transactions-postgres:5432
      user: myuser
    - database: notifications
      jsonData:
        postgresVersion: 15
        sslmode: disable
      name: Notifications-DB
      secureJsonData:
        password: ${NOTIFICATIONS_DB_PASSWORD}
      type: postgres
      url: notifications-postgres:5432
      user: postgres
    - database: payment_db
      jsonData:
        postgresVersion: 15
        sslmode: disable
      name: Payments-DB
      secureJsonData:
        password: ${PAYMENT_DB_PASSWORD}
      type: postgres
      url: payment-postgres:5432
      user: payuser

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-providers
  namespace: tenant-grupo3-egs-deti-ua-pt
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - disableDeletion: false
      editable: true
      folder: ''
      name: Default
      options:
        path: /var/lib/grafana/dashboards
      orgId: 1
      type: file


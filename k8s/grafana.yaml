apiVersion: v1
kind: Secret
metadata:
  name: grafana-secrets
  namespace: tenant-grupo3-egs-deti-ua-pt
type: Opaque
data:
  GF_SECURITY_ADMIN_PASSWORD: YWRtaW4= # admin
  TRANSACTION_DB_PASSWORD: bXlwYXNzd29yZA== # mypassword
  NOTIFICATIONS_DB_PASSWORD: cG9zdGdyZXM= # postgres
  PAYMENT_DB_PASSWORD: cGF5cGFzc3dvcmQ= # paypassword

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources-config
  namespace: tenant-grupo3-egs-deti-ua-pt
data:
  postgres.yaml: |
    apiVersion: 1
    
    datasources:
      - name: Transactions-DB
        type: postgres
        url: transaction-postgres:5432
        database: transaction_db
        user: myuser
        secureJsonData:
          password: ${TRANSACTION_DB_PASSWORD}
        jsonData:
          sslmode: 'disable'
          postgresVersion: 15
    
      - name: Notifications-DB
        type: postgres
        url: egs-notifications-postgres:5432
        database: notifications
        user: postgres
        secureJsonData:
          password: ${NOTIFICATIONS_DB_PASSWORD}
        jsonData:
          sslmode: 'disable'
          postgresVersion: 15
    
      - name: Payments-DB
        type: postgres
        url: payment-postgres:5432
        database: payment_db
        user: payuser
        secureJsonData:
          password: ${PAYMENT_DB_PASSWORD}
        jsonData:
          sslmode: 'disable'
          postgresVersion: 15

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider-config
  namespace: tenant-grupo3-egs-deti-ua-pt
data:
  dashboards.yaml: |
    apiVersion: 1
    
    providers:
      - name: 'Default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /etc/grafana/provisioning/dashboards/json


apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: egs-notifications-postgres-pvc
  namespace: tenant-grupo3-egs-deti-ua-pt
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Secret
metadata:
  name: egs-notifications-secrets
  namespace: tenant-grupo3-egs-deti-ua-pt
type: Opaque
data:
  # Base64 encoded values:
  # postgres
  POSTGRES_PASSWORD: cG9zdGdyZXM=
  # host=egs-notifications-postgres user=postgres password=postgres dbname=notifications port=5432 sslmode=disable TimeZone=UTC
  DATABASE_URL: aG9zdD1lZ3Mtbm90aWZpY2F0aW9ucy1wb3N0Z3JlcyB1c2VyPXBvc3RncmVzIHBhc3N3b3JkPXBvc3RncmVzIGRibmFtZT1ub3RpZmljYXRpb25zIHBvcnQ9NTQzMiBzc2xtb2RlPWRpc2FibGUgVGltZVpvbmU9VVRD
  # master_key
  MASTER_ADMIN_SECRET: bWFzdGVyX2tleQ==
  # jwt_key
  JWT_SECRET: and0X2tleQ==

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egs-notifications-postgres
  namespace: tenant-grupo3-egs-deti-ua-pt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: egs-notifications-postgres
  template:
    metadata:
      labels:
        app: egs-notifications-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
              name: dbport
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: notifications
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: egs-notifications-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/postgresql/data
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "100m"
              memory: "256Mi"
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: egs-notifications-postgres-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: egs-notifications-postgres
  namespace: tenant-grupo3-egs-deti-ua-pt
spec:
  type: ClusterIP
  selector:
    app: egs-notifications-postgres
  ports:
    - port: 5432
      targetPort: 5432

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egs-notifications-redis
  namespace: tenant-grupo3-egs-deti-ua-pt
spec:
  replicas: 1
  selector:
    matchLabels:
      app: egs-notifications-redis
  template:
    metadata:
      labels:
        app: egs-notifications-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: redisport
          resources:
            limits:
              cpu: "200m"
              memory: "256Mi"
            requests:
              cpu: "50m"
              memory: "128Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: egs-notifications-redis
  namespace: tenant-grupo3-egs-deti-ua-pt
spec:
  type: ClusterIP
  selector:
    app: egs-notifications-redis
  ports:
    - port: 6379
      targetPort: 6379

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: egs-notifications-api
  namespace: tenant-grupo3-egs-deti-ua-pt
spec:
  replicas: 2
  selector:
    matchLabels:
      app: egs-notifications-api
  template:
    metadata:
      labels:
        app: egs-notifications-api
    spec:
      containers:
        - name: api
          image: registry.deti/egs_notifications_service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: apiport
          env:
            - name: PORT
              value: "8080"
            - name: GIN_MODE
              value: "release"
            - name: JWT_EXPIRATION_MINUTES
              value: "15"
            - name: REDIS_URL
              value: "egs-notifications-redis:6379"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: egs-notifications-secrets
                  key: DATABASE_URL
            - name: MASTER_ADMIN_SECRET
              valueFrom:
                secretKeyRef:
                  name: egs-notifications-secrets
                  key: MASTER_ADMIN_SECRET
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: egs-notifications-secrets
                  key: JWT_SECRET
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            limits:
              cpu: "500m"
              memory: "256Mi"
            requests:
              cpu: "100m"
              memory: "128Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: egs-notifications-api-svc
  namespace: tenant-grupo3-egs-deti-ua-pt
spec:
  type: ClusterIP
  selector:
    app: egs-notifications-api
  ports:
    - name: http
      port: 8080
      targetPort: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: egs-notifications-api-ingress
  namespace: tenant-grupo3-egs-deti-ua-pt
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: "web"
spec:
  ingressClassName: "traefik"
  rules:
    - host: notifications.grupo3-egs-deti-ua.pt
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: egs-notifications-api-svc
                port:
                  number: 8080

apiVersion: v1
kind: Secret
metadata:
  name: keycloak-secret
  namespace: tenant-grupo3-egs-deti-ua-pt
type: Opaque
stringData:
  KEYCLOAK_ADMIN: admin
  KEYCLOAK_ADMIN_PASSWORD: admin

---

      "registrationEmailAsUsername": false,
      "rememberMe": true,
      "verifyEmail": false,
      "loginWithEmailAllowed": true,
      "duplicateEmailsAllowed": false,
      "resetPasswordAllowed": true,
      "roles": {
        "realm": [
          {
            "name": "user",
            "description": "User role"
          },
          {
            "name": "admin",
            "description": "Admin role"
          }
        ]
      },
      "groups": [],
      "users": [
        {
          "username": "john.doe",
          "enabled": true,
          "email": "john.doe@example.com",
          "firstName": "John",
          "lastName": "Doe",
          "credentials": [
            {
              "type": "password",
              "value": "password1234",
              "temporary": false
            }
          ],
          "realmRoles": [
            "user"
          ]
        }
      ],
      "clients": [
        {
          "clientId": "iam-service",
          "enabled": true,

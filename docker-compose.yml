version: '3.8'

services:
  traefik:
    image: traefik:v3.1
    container_name: traefik
    command:
      - --entrypoints.web.address=:80
      - --providers.file.filename=/etc/traefik/dynamic.yml
      - --providers.file.watch=true
      - --log.level=INFO
    ports:
      - "80:80"
    volumes:
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro
    networks:
      - egs-network

  keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KC_HOSTNAME: http://keycloak.pt
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      ENV_FILE: /vault/secrets/keycloak.env
    entrypoint: ["sh", "/vault/entrypoint.sh", "/opt/keycloak/bin/kc.sh", "start-dev", "--import-realm"]
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./iam_service/realm-export.json:/opt/keycloak/data/import/realm.json:ro
      - ./scripts/vault/entrypoint-env.sh:/vault/entrypoint.sh:ro
      - ./.vault/secrets/keycloak:/vault/secrets:ro
    depends_on:
      - vault-agent-keycloak
    networks:
      - egs-network

  iam-service:
    build:
      context: .
      dockerfile: iam_service/Dockerfile
    container_name: iam-service
    environment:
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://keycloak.pt
      REALM: microservices
      CLIENT_ID: iam-service
      ENV_FILE: /vault/secrets/iam.env
    depends_on:
      - keycloak
      - vault-agent-iam
    volumes:
      - ./.vault/secrets/iam:/vault/secrets:ro
    networks:
      - egs-network

  transaction-postgres:
    image: postgres:15
    container_name: transaction-postgres
    environment:
      POSTGRES_USER: myuser
      POSTGRES_DB: transaction_db
      ENV_FILE: /vault/secrets/transaction-postgres.env
    entrypoint: ["sh", "/vault/entrypoint.sh", "docker-entrypoint.sh", "postgres"]
    volumes:
      - transaction_pgdata:/var/lib/postgresql/data
      - ./scripts/vault/entrypoint-env.sh:/vault/entrypoint.sh:ro
      - ./.vault/secrets/transaction-postgres:/vault/secrets:ro
    depends_on:
      - vault-agent-transaction-postgres
    networks:
      - transactions-db-network

  transactions-service:
    build:
      context: ./transactions_service
      dockerfile: Dockerfile
    container_name: transactions-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://transaction-postgres:5432/transaction_db
      SPRING_DATASOURCE_USERNAME: myuser
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_PUBLIC_URL: http://keycloak.pt
      KEYCLOAK_REALM: microservices
      KEYCLOAK_CLIENT_ID: iam-service
      APP_DEV_MODE: "false"
      APP_BANK_WALLET: "0x86a9906e6bd2ef137d6d5339154611de7a41b178"
      APP_PAYMENT_SERVICE_URL: http://payment-backend:5002
      APP_TRANSACTION_FEE_PERCENTAGE: "2.0"
      APP_TRANSACTION_FEE_RECIPIENT: "0x86a9906e6bd2ef137d6d5339154611de7a41b178"
      NOTIFICATIONS_BASE_URL: https://services.tiagorg.pt/notifications
      ENV_FILE: /vault/secrets/transactions.env
    depends_on:
      - transaction-postgres
      - keycloak
      - egs-notifications-api
      - vault-agent-transactions
    volumes:
      - ./.vault/secrets/transactions:/vault/secrets:ro
    networks:
      - egs-network
      - transactions-db-network

  egs-notifications-postgres:
    image: postgres:15-alpine
    container_name: egs_notifications_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: notifications
      ENV_FILE: /vault/secrets/notifications-postgres.env
    entrypoint: ["sh", "/vault/entrypoint.sh", "docker-entrypoint.sh", "postgres"]
    volumes:
      - egs_notifications_postgres_data:/var/lib/postgresql/data
      - ./scripts/vault/entrypoint-env.sh:/vault/entrypoint.sh:ro
      - ./.vault/secrets/notifications-postgres:/vault/secrets:ro
    depends_on:
      - vault-agent-notifications-postgres
    networks:
      - notifications-db-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  egs-notifications-redis:
    image: redis:7-alpine
    container_name: egs_notifications_redis
    volumes:
      - egs_notifications_redis_data:/data
    networks:
      - notifications-db-network

  egs-notifications-api:
    build:
      context: ./notifications_service
      dockerfile: Dockerfile
    image: egs_notifications_service
    container_name: egs_notifications_api
    environment:
      PORT: 8080
      GIN_MODE: release
      JWT_EXPIRATION_MINUTES: "15"
      REDIS_URL: egs_notifications_redis:6379
      ENV_FILE: /vault/secrets/notifications.env
    depends_on:
      - egs-notifications-postgres
      - egs-notifications-redis
      - vault-agent-notifications
    volumes:
      - ./.vault/secrets/notifications:/vault/secrets:ro
    networks:
      - egs-network
      - notifications-db-network

  payment-postgres:
    image: postgres:15
    container_name: payment-postgres
    environment:
      POSTGRES_USER: payuser
      POSTGRES_DB: payment_db
      ENV_FILE: /vault/secrets/payment-postgres.env
    entrypoint: ["sh", "/vault/entrypoint.sh", "docker-entrypoint.sh", "postgres"]
    volumes:
      - payment_pgdata:/var/lib/postgresql/data
      - ./scripts/vault/entrypoint-env.sh:/vault/entrypoint.sh:ro
      - ./.vault/secrets/payment-postgres:/vault/secrets:ro
    depends_on:
      - vault-agent-payment-postgres
    networks:
      - payment-db-network

  payment-keycloak:
    image: quay.io/keycloak/keycloak:26.1
    container_name: payment-keycloak
    environment:
      KEYCLOAK_ADMIN: admin
      KC_HOSTNAME: http://payment-keycloak.pt
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      ENV_FILE: /vault/secrets/payment-keycloak.env
    entrypoint: ["sh", "/vault/entrypoint.sh", "/opt/keycloak/bin/kc.sh", "start-dev", "--import-realm"]
    volumes:
      - payment_keycloak_data:/opt/keycloak/data
      - ./payment_service/realm-export.json:/opt/keycloak/data/import/realm.json:ro
      - ./scripts/vault/entrypoint-env.sh:/vault/entrypoint.sh:ro
      - ./.vault/secrets/payment-keycloak:/vault/secrets:ro
    depends_on:
      - vault-agent-payment-keycloak
    networks:
      - egs-network

  payment-backend:
    build:
      context: ./payment_service
      dockerfile: Dockerfile.backend
    container_name: payment-backend
    environment:
      PAYMENT_KEYCLOAK_URL: http://payment-keycloak:8080
      PAYMENT_KEYCLOAK_PUBLIC_URL: http://payment-keycloak.pt
      PAYMENT_PUBLIC_URL: http://payment.pt
      PAYMENT_REALM: payments-realm
      PAYMENT_CLIENT_ID: payments-client
      TRANSACTIONS_SERVICE_URL: http://transactions-service:8081
      ENV_FILE: /vault/secrets/payment.env
    depends_on:
      - payment-postgres
      - payment-keycloak
      - transactions-service
      - vault-agent-payment
    volumes:
      - ./.vault/secrets/payment:/vault/secrets:ro
    networks:
      - egs-network
      - payment-db-network

  payment-frontend:
    build:
      context: ./payment_service/frontend
      dockerfile: Dockerfile.frontend
    container_name: payment-frontend
    environment:
      VITE_PROXY_TARGET: http://payment-backend:5002
      VITE_PAYMENT_DEFAULT_REDIRECT_URL: http://app.pt/dashboard
    depends_on:
      - payment-backend
    networks:
      - egs-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
    container_name: frontend
    environment:
      VITE_PROXY_TARGET: http://transactions-service:8081
      VITE_IAM_BASE_URL: http://iam.pt
      VITE_TRANSACTIONS_BASE_URL: http://transactions.pt
      VITE_PAYMENT_BASE_URL: http://payment.pt
    depends_on:
      - iam-service
      - transactions-service
    networks:
      - egs-network

  payment-stripe-cli:
    image: stripe/stripe-cli
    container_name: payment-stripe-cli
    entrypoint: ["/bin/sh", "/vault/entrypoint.sh", "/bin/sh", "-c",
                 "stripe listen --api-key $$STRIPE_SECRET_KEY --forward-to http://payment-backend:5002/v1/payments/webhook"]
    environment:
      ENV_FILE: /vault/secrets/payment.env
    volumes:
      - ./scripts/vault/entrypoint-env.sh:/vault/entrypoint.sh:ro
      - ./.vault/secrets/payment:/vault/secrets:ro
    depends_on:
      - payment-backend
      - vault-agent-payment
    networks:
      - egs-network

  grafana:
    image: grafana/grafana:10.0.0
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - TRANSACTION_DB_PASSWORD=${TRANSACTION_DB_PASSWORD:-mypassword}
      - NOTIFICATIONS_DB_PASSWORD=${NOTIFICATIONS_DB_PASSWORD:-postgres}
      - PAYMENT_DB_PASSWORD=${PAYMENT_DB_PASSWORD:-paypassword}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    networks:
      - egs-network
      - transactions-db-network
      - notifications-db-network
      - payment-db-network
    depends_on:
      - transaction-postgres
      - egs-notifications-postgres
      - payment-postgres

  vault-agent-transactions:
    image: hashicorp/vault:1.17
    container_name: vault-agent-transactions
    entrypoint: ["vault"]
    command: ["agent", "-config=/vault/config/transactions.hcl"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      VAULT_DISABLE_MLOCK: "true"
      SKIP_SETCAP: "1"
    volumes:
      - ./.vault/secrets/transactions:/vault/secrets
      - ./.vault/approle/transactions/role_id:/vault/role_id:ro
      - ./.vault/approle/transactions/secret_id:/vault/secret_id:ro
      - ./vault/agent/transactions.hcl:/vault/config/transactions.hcl:ro
      - ./vault/templates/transactions.env.tmpl:/vault/templates/transactions.env.tmpl:ro
    networks:
      - egs-network

  vault-agent-iam:
    image: hashicorp/vault:1.17
    container_name: vault-agent-iam
    entrypoint: ["vault"]
    command: ["agent", "-config=/vault/config/iam.hcl"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      VAULT_DISABLE_MLOCK: "true"
      SKIP_SETCAP: "1"
    volumes:
      - ./.vault/secrets/iam:/vault/secrets
      - ./.vault/approle/iam/role_id:/vault/role_id:ro
      - ./.vault/approle/iam/secret_id:/vault/secret_id:ro
      - ./vault/agent/iam.hcl:/vault/config/iam.hcl:ro
      - ./vault/templates/iam.env.tmpl:/vault/templates/iam.env.tmpl:ro
    networks:
      - egs-network

  vault-agent-notifications:
    image: hashicorp/vault:1.17
    container_name: vault-agent-notifications
    entrypoint: ["vault"]
    command: ["agent", "-config=/vault/config/notifications.hcl"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      VAULT_DISABLE_MLOCK: "true"
      SKIP_SETCAP: "1"
    volumes:
      - ./.vault/secrets/notifications:/vault/secrets
      - ./.vault/approle/notifications/role_id:/vault/role_id:ro
      - ./.vault/approle/notifications/secret_id:/vault/secret_id:ro
      - ./vault/agent/notifications.hcl:/vault/config/notifications.hcl:ro
      - ./vault/templates/notifications.env.tmpl:/vault/templates/notifications.env.tmpl:ro
    networks:
      - egs-network

  vault-agent-payment:
    image: hashicorp/vault:1.17
    container_name: vault-agent-payment
    entrypoint: ["vault"]
    command: ["agent", "-config=/vault/config/payment.hcl"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      VAULT_DISABLE_MLOCK: "true"
      SKIP_SETCAP: "1"
    volumes:
      - ./.vault/secrets/payment:/vault/secrets
      - ./.vault/approle/payment/role_id:/vault/role_id:ro
      - ./.vault/approle/payment/secret_id:/vault/secret_id:ro
      - ./vault/agent/payment.hcl:/vault/config/payment.hcl:ro
      - ./vault/templates/payment.env.tmpl:/vault/templates/payment.env.tmpl:ro
    networks:
      - egs-network

  vault-agent-transaction-postgres:
    image: hashicorp/vault:1.17
    container_name: vault-agent-transaction-postgres
    entrypoint: ["vault"]
    command: ["agent", "-config=/vault/config/transaction-postgres.hcl"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      VAULT_DISABLE_MLOCK: "true"
      SKIP_SETCAP: "1"
    volumes:
      - ./.vault/secrets/transaction-postgres:/vault/secrets
      - ./.vault/approle/transaction-postgres/role_id:/vault/role_id:ro
      - ./.vault/approle/transaction-postgres/secret_id:/vault/secret_id:ro
      - ./vault/agent/transaction-postgres.hcl:/vault/config/transaction-postgres.hcl:ro
      - ./vault/templates/transaction-postgres.env.tmpl:/vault/templates/transaction-postgres.env.tmpl:ro
    networks:
      - egs-network

  vault-agent-notifications-postgres:
    image: hashicorp/vault:1.17
    container_name: vault-agent-notifications-postgres
    entrypoint: ["vault"]
    command: ["agent", "-config=/vault/config/notifications-postgres.hcl"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      VAULT_DISABLE_MLOCK: "true"
      SKIP_SETCAP: "1"
    volumes:
      - ./.vault/secrets/notifications-postgres:/vault/secrets
      - ./.vault/approle/notifications-postgres/role_id:/vault/role_id:ro
      - ./.vault/approle/notifications-postgres/secret_id:/vault/secret_id:ro
      - ./vault/agent/notifications-postgres.hcl:/vault/config/notifications-postgres.hcl:ro
      - ./vault/templates/notifications-postgres.env.tmpl:/vault/templates/notifications-postgres.env.tmpl:ro
    networks:
      - egs-network

  vault-agent-payment-postgres:
    image: hashicorp/vault:1.17
    container_name: vault-agent-payment-postgres
    entrypoint: ["vault"]
    command: ["agent", "-config=/vault/config/payment-postgres.hcl"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      VAULT_DISABLE_MLOCK: "true"
      SKIP_SETCAP: "1"
    volumes:
      - ./.vault/secrets/payment-postgres:/vault/secrets
      - ./.vault/approle/payment-postgres/role_id:/vault/role_id:ro
      - ./.vault/approle/payment-postgres/secret_id:/vault/secret_id:ro
      - ./vault/agent/payment-postgres.hcl:/vault/config/payment-postgres.hcl:ro
      - ./vault/templates/payment-postgres.env.tmpl:/vault/templates/payment-postgres.env.tmpl:ro
    networks:
      - egs-network

  vault-agent-keycloak:
    image: hashicorp/vault:1.17
    container_name: vault-agent-keycloak
    entrypoint: ["vault"]
    command: ["agent", "-config=/vault/config/keycloak.hcl"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      VAULT_DISABLE_MLOCK: "true"
      SKIP_SETCAP: "1"
    volumes:
      - ./.vault/secrets/keycloak:/vault/secrets
      - ./.vault/approle/keycloak/role_id:/vault/role_id:ro
      - ./.vault/approle/keycloak/secret_id:/vault/secret_id:ro
      - ./vault/agent/keycloak.hcl:/vault/config/keycloak.hcl:ro
      - ./vault/templates/keycloak.env.tmpl:/vault/templates/keycloak.env.tmpl:ro
    networks:
      - egs-network

  vault-agent-payment-keycloak:
    image: hashicorp/vault:1.17
    container_name: vault-agent-payment-keycloak
    entrypoint: ["vault"]
    command: ["agent", "-config=/vault/config/payment-keycloak.hcl"]
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}"
    environment:
      VAULT_DISABLE_MLOCK: "true"
      SKIP_SETCAP: "1"
    volumes:
      - ./.vault/secrets/payment-keycloak:/vault/secrets
      - ./.vault/approle/payment-keycloak/role_id:/vault/role_id:ro
      - ./.vault/approle/payment-keycloak/secret_id:/vault/secret_id:ro
      - ./vault/agent/payment-keycloak.hcl:/vault/config/payment-keycloak.hcl:ro
      - ./vault/templates/payment-keycloak.env.tmpl:/vault/templates/payment-keycloak.env.tmpl:ro
    networks:
      - egs-network

volumes:
  keycloak_data:
  transaction_pgdata:
  egs_notifications_postgres_data:
  egs_notifications_redis_data:
  payment_pgdata:
  payment_keycloak_data:

networks:
  egs-network:
    name: egs-network
    external: true

  transactions-db-network:
    name: transactions-db-network
    internal: true

  payment-db-network:
    name: payment-db-network
    internal: true

  notifications-db-network:
    name: notifications-db-network
    internal: true

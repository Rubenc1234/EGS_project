server {
    listen       80;
    server_name  localhost;

    root /usr/share/nginx/html;
    index index.html;

    # API paths are handled by the cluster Ingress (Traefik). Do not proxy
    # directly to internal services by host:port; Traefik routes requests for
    # '/v1/*' to the payment-service within the cluster.

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
    }
}
